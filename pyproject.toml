[project]
name = "triage-app"
version = "0.1.0"
description = "Email triage and newsflow prototype: Jev classification, attention notes and thesis suggestions over a synthetic five-company book."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.11",
    "dspy[typesafe]==3.4.0",
    "typesafe-sdk>=0.6.0,<1.0.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "rapidfuzz>=3.0",
    "huggingface-hub>=0.30",
    "sentence-transformers>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13"]
notebook = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = ["src", "tests"]

# DSPy ships no type information, so its classes are `Any` to mypy; the modules that
# subclass dspy.Signature / Module / BaseLM / ReAct may do so without per-line ignores.
[[tool.mypy.overrides]]
module = ["triage_app.modules.*", "test_lm"]
disallow_subclassing_any = false
