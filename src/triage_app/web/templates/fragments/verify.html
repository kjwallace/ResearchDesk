<div class="panel small">
  <span class="pill {{ 'ok' if verify.verdict == 'confirmed' else ('failed' if verify.verdict == 'contradicted' else '') }}">{{ verify.verdict | replace('_', ' ') }}</span>
  {{ verify.explanation }}
  {% for src in verify.sources %}<blockquote><span class="muted">{{ src.source }}:</span> {{ src.quote }}</blockquote>{% endfor %}
</div>
